[project]
name = "calorie-tracker-backend"
version = "0.1.0"
description = "Backend for the Calorie Tracker's photo-upload calorie analysis and daily log storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
